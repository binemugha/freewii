appId: com.binemugha.freewii
productName: FreeWii
artifactName: FreeWii-${os}-${arch}.${ext}
asar: true
npmRebuild: false
directories:
  output: dist
files:
  - desktop/**/*
  - server.js
  - scripts/gen-cert.js
  - public/**/*
  - core/**/*
  - games/**/*
  - assets/**/*
  - build/icon.png
  - "!games/mario-kart/evidence/**/*"
  - "!**/*.test.mjs"
  - "!tests/**/*"
mac:
  category: public.app-category.games
  icon: build/icon.icns
  identity: "-"
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  icon: build/icon.png
  category: Game
  target:
    - target: AppImage
      arch:
        - x64
publish:
  - provider: github
    owner: binemugha
    repo: freewii
